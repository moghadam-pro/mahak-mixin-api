name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, pdo_sqlite
          coverage: none
      - run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l bin/console
      - run: php tests/run.php
